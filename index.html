<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Concept Đa Dạng - Tiệm Ảnh Trái Thơm</title>
    <meta name="description" content="Trải nghiệm bộ sưu tập concept chụp ảnh đa dạng tại Tiệm Ảnh Trái Thơm. Dịch vụ chụp ảnh chuyên nghiệp, trang phục makeup cao cấp.">
    
    <!-- Tải trước phông chữ Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,600;1,700&family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,600&display=swap" rel="stylesheet">

<body>
    <!-- 
        Container gắn giao diện động Tiệm Ảnh Trái Thơm.
        Tệp custom-tiemanh.js sẽ tự động phát hiện container này và render toàn bộ giao diện Landing Page chuyên nghiệp vào đây.
    -->
    <div id="tiemanh-container"></div>

    <!-- Nhúng trực tiếp tệp script -->
    <script src="custom-tiemanh.js"></script>

    <!-- 
        Đoạn mã ví dụ hướng dẫn tích hợp tracking pixel (Facebook Pixel, GTM) cho Webcake:
        <script>
            window.addEventListener("tiemanh-booking-success", function(event) {
                console.log("Đặt lịch thành công, gửi dữ liệu sang Pixel:", event.detail);
                // Ví dụ FB Pixel: fbq('track', 'Lead', { value: 0, currency: 'VND' });
            });
        </script>
    -->
